services:
  graphhopper:
    image: israelhikingmap/graphhopper@sha256:a63a6b2ddb4086fa0407fd7ae977d521ee5cf31835fe5bb3e56dd855a8556424
    container_name: vrstevnice-gh
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - gh-data:/data
      - ./docker/graphhopper-config.yml:/graphhopper/config-example.yml:ro
      - ./docker/vrstevnice-bike.json:/graphhopper/vrstevnice-bike.json:ro
      - ./data/czech-republic-latest.osm.pbf:/data/czech-republic-latest.osm.pbf:ro
    environment:
      JAVA_OPTS: "-Xmx3g -Xms2g"
    command:
      - "-i"
      - "/data/czech-republic-latest.osm.pbf"
      - "-o"
      - "/data/graph-cache-osmwayid"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  photon:
    image: rtuszik/photon-docker:latest
    container_name: vrstevnice-photon
    restart: unless-stopped
    ports:
      - "2322:2322"
    volumes:
      - photon-data:/photon/data
    environment:
      JAVA_OPTS: "-Xmx512m -Xms256m"
      INITIAL_DOWNLOAD: "FALSE"
      UPDATE_STRATEGY: "DISABLED"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2322/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  tileserver:
    image: maptiler/tileserver-gl-light:latest
    container_name: vrstevnice-tileserver
    restart: unless-stopped
    ports:
      - "2323:8080"
    volumes:
      - ./data:/data:ro
      - ./docker/tileserver:/config:ro
    working_dir: /config
    command: [--config, /config/config.json]
    healthcheck:
      # tileserver-gl-light image has no curl — it is a Node app, use node fetch
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/', {signal: AbortSignal.timeout(5000)}).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  gh-data:
  photon-data:
