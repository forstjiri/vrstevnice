name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Integration tests (require running BE/FE/Docker services) are excluded from CI.
      # Run them manually via the "Integration Tests" workflow or locally with `pnpm test -- tests/<name>.test.ts`.
      - run: pnpm test -- --reporter=verbose --exclude tests/e2e-smoke.test.ts --exclude tests/routing/smoke.test.ts --exclude tests/routing/routing.test.ts --exclude tests/shadow-profile.test.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
