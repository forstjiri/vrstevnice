name: Integration Tests

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    # Only run on major version releases (v1, v2, ...) or manual trigger
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/tags/v{0}', github.event.release.tag_name)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start GraphHopper test container
        working-directory: docker
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests
        run: pnpm test -- --reporter=verbose tests/e2e-smoke.test.ts tests/routing/smoke.test.ts tests/routing/routing.test.ts
        env:
          GRAPHHOPPER_URL: "http://localhost:8988"

      - name: Docker logs on failure
        if: failure()
        working-directory: docker
        run: docker compose -f docker-compose.test.yml logs
